[functions]
  directory = "netlify/functions"

[functions."backup-scheduled"]
  schedule = "0 2 * * *"

[functions."backup-retention"]
  schedule = "0 3 * * *"

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/version"
  to = "/.netlify/functions/version"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/backup-admin"
  to = "/.netlify/functions/backup-admin"
  status = 200

# SPA fallback for any normal application route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never serve an old HTML shell from an intermediary cache.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
[[headers]]
  for = "/sync-runtime-v1.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
